<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>In the 掘～る</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================
           全体
        ========================= */

        body {
            margin: 0;
            font-family: sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #8b5a2b 0 8%, transparent 9%),
                radial-gradient(circle at 80% 70%, #6b4423 0 10%, transparent 11%),
                linear-gradient(#5b3a29, #3b271c);
            color: #fff;
            min-height: 100vh;
        }

        /* =========================
           ヘッダー
        ========================= */

        header {
            text-align: center;
            padding: 35px 20px 25px;
            background: rgba(0, 0, 0, 0.25);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #ffd966;
            text-shadow: 3px 3px 0 #4a2c18;
        }

        header p {
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* =========================
           タブ
        ========================= */

        .tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            background: #2c1b12;
            padding: 10px;
        }

        .tab-button {
            border: none;
            background: #5c4030;
            color: white;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: 0.2s;
        }

        .tab-button:hover {
            background: #79543a;
        }

        /* 選択中のタブ */
        .tab-button.active {
            background: #d9a441;
            color: #3b271c;
        }

        /* =========================
           メイン
        ========================= */

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        /* =========================
           各ページ
        ========================= */

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
        }

        /* 表示するページ */
        .tab-content.active {
            display: block;
        }

        h2 {
            text-align: center;
            color: #ffd966;
            margin-top: 0;
            font-size: 2rem;
        }

        h3 {
            color: #ffd966;
            border-left: 5px solid #d9a441;
            padding-left: 10px;
        }

        /* =========================
           動画
        ========================= */

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #24170f;
            border: 3px dashed #c49a5a;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 20px 0;
            color: #c9b59a;
        }

        /* =========================
           ランキング
        ========================= */

        .ranking {
            max-width: 600px;
            margin: 0 auto;
        }

        .rank {
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            margin: 12px 0;

            border-radius: 10px;
            font-size: 1.2rem;
        }

        .rank-number {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score {
            font-weight: bold;
            color: #ffd966;
        }

        /* =========================
           待ち状況
        ========================= */

        .waiting-box {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .waiting-label {
            font-size: 1rem;
            margin-top: 20px;
        }

        .waiting-number {
            font-size: 4rem;
            font-weight: bold;
            color: #ffd966;
            margin: 10px 0 30px;
        }

        .next-number {
            font-size: 2rem;
            font-weight: bold;
        }

        /* =========================
           スマホ対応
        ========================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 2rem;
            }

            .tabs {
                gap: 2px;
            }

            .tab-button {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .tab-content {
                padding: 20px 15px;
            }

            .waiting-number {
                font-size: 3rem;
            }
        }
        
        /* ===== In the 掘～る：洞窟・宝探しテーマ ===== */
        
        :root {
            --cave-dark: #171a22;
            --cave-panel: #252a35;
            --cave-stone: #393d49;
            --gem-blue: #55e6e0;
            --gem-purple: #b59aff;
            --treasure-gold: #ffd477;
            --text-main: #f8f1df;
            --text-sub: #c5c7d0;
        }
        
        /* ページ全体：洞窟の奥行きを表現 */
        body {
            background:
                radial-gradient(
                    ellipse at 15% 15%,
                    rgba(77, 79, 117, 0.32),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 85% 45%,
                    rgba(38, 117, 123, 0.22),
                    transparent 32%
                ),
                linear-gradient(
                    160deg,
                    #20232d 0%,
                    #171a22 55%,
                    #30252a 100%
                );
        
            color: var(--text-main);
            font-family: "Trebuchet MS", "Yu Gothic", sans-serif;
        }
        
        /* 見出し */
        h2 {
            color: var(--treasure-gold);
            text-shadow: 0 0 14px rgba(255, 212, 119, 0.2);
            letter-spacing: 0.04em;
        }
        
        h3 {
            color: var(--gem-blue);
            border-bottom: 1px solid rgba(85, 230, 224, 0.35);
            padding-bottom: 8px;
            margin-top: 28px;
        }
        
        /* ゲーム紹介・各コンテンツ */
        #top,
        #ranking,
        #waiting {
            color: var(--text-main);
        }
        
        /* 動画を洞窟のスクリーン風に */
        .video-box {
            background:
                radial-gradient(
                    ellipse at center,
                    #33394a 0%,
                    #151820 75%
                );
        
            border: 2px solid #686477;
            border-radius: 16px;
            padding: 12px;
            box-shadow:
                0 0 0 4px rgba(181, 154, 255, 0.08),
                0 0 25px rgba(85, 230, 224, 0.12);
            overflow: hidden;
        }
        
        .video-box video,
        .video-box iframe {
            display: block;
            width: 100%;
            max-width: 100%;
            border-radius: 8px;
        }
        
        /* ランキングの各行 */
        .rank {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(
                110deg,
                rgba(62, 66, 82, 0.95),
                rgba(35, 39, 51, 0.95)
            );
            border: 1px solid rgba(181, 154, 255, 0.22);
            border-radius: 12px;
            padding: 14px 16px;
            margin: 10px 0;
            color: var(--text-main);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
        }
        
        /* 順位 */
        .rank-number {
            color: var(--treasure-gold);
            font-weight: bold;
            white-space: nowrap;
        }
        
        /* プレイヤー名 */
        .player-name {
            flex: 1;
            text-align: center;
            overflow-wrap: anywhere;
        }
        
        /* スコア */
        .score {
            color: var(--gem-blue);
            font-weight: bold;
            white-space: nowrap;
        }
        
        /* 待ち番号の表示 */
        #waiting-number,
        #current-waiting {
            color: var(--treasure-gold);
            font-size: 1.5em;
            font-weight: bold;
        }
        
        /* 次の番号 */
        #next-number {
            color: var(--gem-blue);
            font-size: 1.3em;
            font-weight: bold;
        }
        
        /* タブやボタン */
        button {
            background: linear-gradient(
                135deg,
                #65518e,
                #3b6380
            );
            color: #ffffff;
            border: 1px solid rgba(181, 154, 255, 0.55);
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: bold;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;
        }
        
        button:hover {
            filter: brightness(1.18);
            transform: translateY(-2px);
            box-shadow: 0 5px 18px rgba(85, 230, 224, 0.16);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        /* 入力欄 */
        input {
            background: #171a22;
            color: var(--text-main);
            border: 1px solid #666b7b;
            border-radius: 8px;
            padding: 10px;
        }
        
        input:focus {
            outline: 2px solid var(--gem-blue);
            outline-offset: 2px;
        }
        
        /* スマートフォン向け */
        @media (max-width: 600px) {
            .rank {
                gap: 8px;
                padding: 12px 10px;
                font-size: 0.92rem;
            }
        
            .video-box {
                padding: 6px;
            }
        
            .video-box iframe {
                height: 240px;
            }
        
            button {
                max-width: 100%;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         ヘッダー
    ========================= -->

    <header>
        <h1>⛏️ In the 掘～る 💎</h1>
        <p>掘って、掘って、宝を見つけよう！</p>
    </header>


    <!-- =========================
         タブ
    ========================= -->

    <nav class="tabs">

        <button class="tab-button active" onclick="showTab('top', this)">
            TOP
        </button>

        <button class="tab-button" onclick="showTab('ranking', this)">
            Ranking
        </button>

        <button class="tab-button" onclick="showTab('waiting', this)">
            Waiting list
        </button>

    </nav>


    <!-- =========================
         メイン
    ========================= -->

    <main>


        <!-- =========================
             TOP
        ========================= -->

        <section id="top" class="tab-content active">

            <h2>⛏️ In the 掘～る</h2>

            <h3>ゲーム紹介</h3>

            <p>
                「In the 掘～る」は、土を掘って宝を探すゲームです。
            </p>

            <p>
                どんな宝が見つかるかは掘ってみてのお楽しみ！
            </p>


            <h3>プレイ動画</h3>
            
            <div class="video-box">
                <iframe
                    width="100%"
                    height="400"
                    src="https://www.youtube.com/embed/mhIra42MCbY"
                    title="In the 掘～る プレイ動画"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>


        </section>



        <!-- =========================
             Ranking
        ========================= -->

        <section id="ranking" class="tab-content">

            <h2>🏆 Ranking</h2>

            <div class="ranking" id="ranking-list">
                読み込み中...
            </div>

        </section>



        <!-- =========================
             Waiting list
        ========================= -->

        <section id="waiting" class="tab-content">

            <h2>🎫 Waiting list</h2>

            <div class="waiting-box">

                <div class="waiting-label">
                    現在のご案内
                </div>

                <div class="waiting-number" id="waiting-number">
                    読み込み中・・・
                </div>


                <div class="waiting-label">
                    次のご案内
                </div>

                <div class="next-number" id="next-number">
                    読み込み中・・・
                </div>

            </div>

        </section>


    </main>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        function showTab(tabId, button) {

            // すべてのページを非表示にする
            const contents = document.querySelectorAll('.tab-content');

            contents.forEach(function(content) {
                content.classList.remove('active');
            });


            // 選択されたページを表示する
            const selectedTab = document.getElementById(tabId);

            selectedTab.classList.add('active');


            // すべてのタブから active を削除
            const buttons = document.querySelectorAll('.tab-button');

            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });


            // 押されたタブを active にする
            button.classList.add('active');
        }
        const SUPABASE_URL = 'https://okylctjknvtphzufkhnl.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable__UirMzB19mwcS1FZg-CHUg_DVJxgjPy';


        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        async function loadRanking() {
            const { data, error } = await supabaseClient
                .from('ranking')
                .select('player_name, score')
                .order('score', { ascending: false })
                .limit(3);

            if (error) {
                console.error(error);

                document.getElementById('ranking-list').textContent =
                    'ランキングを読み込めませんでした';

                return;
            }

            const rankingList = document.getElementById('ranking-list');

            rankingList.innerHTML = '';

            data.forEach((player, index) => {

                const rank = document.createElement('div');
                rank.className = 'rank';

                let medal;

                if (index === 0) {
                    medal = '🥇';
                } else if (index === 1) {
                    medal = '🥈';
                } else {
                    medal = '🥉';
                }

                rank.innerHTML = `
            <span class="rank-number">
                ${medal} ${index + 1}位
            </span>

            <span class="player-name">
                ${player.player_name}
            </span>

            <span class="score">
                ${player.score}点
            </span>
`        ;

                rankingList.appendChild(rank);
            });
        }

        loadRanking();


        async function loadWaitingNumber() {

            const { data, error } = await supabaseClient
                .from('waiting_info')
                .select('waiting_number')
                .eq('id', 1)
                .single();


            if (error) {

                console.error(error);

                document.getElementById('waiting-number').textContent =
                    '読み込みエラー';

                return;
            }


            document.getElementById('waiting-number').textContent =
                'No. ' + data.waiting_number;
            document.getElementById('next-number').textContent =
                'No. ' + (data.waiting_number + 1);
        }


        loadWaitingNumber();

    </script>

</body>
</html>
